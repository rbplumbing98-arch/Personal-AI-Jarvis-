name: Build and release JARVIS Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      JARVIS_SIGNING_CONFIGURED: ${{ secrets.JARVIS_KEYSTORE_BASE64 != '' && secrets.JARVIS_KEYSTORE_PASSWORD != '' && secrets.JARVIS_KEY_ALIAS != '' && secrets.JARVIS_KEY_PASSWORD != '' }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android platform
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - name: Build validation APK
        env:
          JARVIS_VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleDebug
      - name: Upload validation APK
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-validation-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Prepare permanent signing key
        if: ${{ env.JARVIS_SIGNING_CONFIGURED == 'true' }}
        env:
          JARVIS_KEYSTORE_BASE64: ${{ secrets.JARVIS_KEYSTORE_BASE64 }}
        run: |
          echo "$JARVIS_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/jarvis-release.jks"
      - name: Build permanently signed release APK
        if: ${{ env.JARVIS_SIGNING_CONFIGURED == 'true' }}
        env:
          JARVIS_KEYSTORE_PATH: ${{ runner.temp }}/jarvis-release.jks
          JARVIS_KEYSTORE_PASSWORD: ${{ secrets.JARVIS_KEYSTORE_PASSWORD }}
          JARVIS_KEY_ALIAS: ${{ secrets.JARVIS_KEY_ALIAS }}
          JARVIS_KEY_PASSWORD: ${{ secrets.JARVIS_KEY_PASSWORD }}
          JARVIS_VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew --no-daemon --stacktrace :app:assembleRelease
      - name: Publish JARVIS update release
        if: ${{ success() && env.JARVIS_SIGNING_CONFIGURED == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: jarvis-build-${{ github.run_number }}
          name: JARVIS update ${{ github.run_number }}
          generate_release_notes: true
          make_latest: true
          files: app/build/outputs/apk/release/app-release.apk
