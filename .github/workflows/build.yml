name: Build and release JARVIS Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    branches: [main]
concurrency:
  group: jarvis-android-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build installable debug APK
        env:
          JARVIS_VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish JARVIS APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: jarvis-build-${{ github.run_number }}
          name: JARVIS build ${{ github.run_number }}
          generate_release_notes: true
          make_latest: true
          files: app/build/outputs/apk/debug/app-debug.apk
