name: Build and release JARVIS Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    branches: [main]
concurrency:
  group: jarvis-android-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Prepare stable release signing
        id: signing
        env:
          JARVIS_KEYSTORE_BASE64: ${{ secrets.JARVIS_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$JARVIS_KEYSTORE_BASE64" ] && [ -n "${{ secrets.JARVIS_KEYSTORE_PASSWORD }}" ] && [ -n "${{ secrets.JARVIS_KEY_ALIAS }}" ] && [ -n "${{ secrets.JARVIS_KEY_PASSWORD }}" ]; then
            echo "$JARVIS_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/jarvis-release.jks"
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Stable release signing key found."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Stable release signing is not configured. Building a debug APK only; in-place updates will be blocked unless the signing certificate matches."
          fi
      - name: Run Android lint and unit-test checks
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace :app:lintDebug :app:testDebugUnitTest
      - name: Build stable signed release APK
        if: steps.signing.outputs.ready == 'true' && github.event_name != 'pull_request'
        env:
          JARVIS_VERSION_CODE: ${{ github.run_number }}
          JARVIS_KEYSTORE_PATH: ${{ runner.temp }}/jarvis-release.jks
          JARVIS_KEYSTORE_PASSWORD: ${{ secrets.JARVIS_KEYSTORE_PASSWORD }}
          JARVIS_KEY_ALIAS: ${{ secrets.JARVIS_KEY_ALIAS }}
          JARVIS_KEY_PASSWORD: ${{ secrets.JARVIS_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleRelease
          mkdir -p app/build/outputs/apk/final
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/final/jarvis.apk
      - name: Build debug APK (no stable signing key configured)
        if: steps.signing.outputs.ready != 'true' || github.event_name == 'pull_request'
        env:
          JARVIS_VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleDebug
          mkdir -p app/build/outputs/apk/final
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/final/jarvis.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-${{ steps.signing.outputs.ready == 'true' && 'release' || 'debug' }}-${{ github.run_number }}
          path: app/build/outputs/apk/final/jarvis.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish JARVIS APK
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: jarvis-build-${{ github.run_number }}
          name: JARVIS build ${{ github.run_number }}
          generate_release_notes: true
          make_latest: true
          files: app/build/outputs/apk/final/jarvis.apk
